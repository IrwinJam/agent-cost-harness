<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cost A/B</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Cost A/B</h1>
    <p id="summary">Waiting for conversations.</p>
    <table>
      <tr><th>Group</th><th>Conversations</th><th>Cost per conversation</th><th>Cached input</th><th>Spent</th></tr>
      <tr><td><i class="a"></i>Policies</td><td id="policies-n"></td><td id="policies-mean"></td><td id="policies-hit"></td><td id="policies-total"></td></tr>
      <tr><td><i class="b"></i>Control</td><td id="control-n"></td><td id="control-mean"></td><td id="control-hit"></td><td id="control-total"></td></tr>
    </table>
    <h2>Average cost per conversation</h2>
    <div id="chart"></div>
    <p id="note"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
