[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-cost-harness"
version = "0.1.0"
description = "Cut your AI agent's API cost by about 37% with the same success rate. Profiles where tokens go and applies cache-aware cost policies."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
]

[project.scripts]
agent-cost-harness = "harness.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
